# Development overlay, for day-to-day code changes:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# The image is still built from the Dockerfile (dependencies, system libraries
# and the non-root user all stay); only app/ is replaced by the directory on
# your disk, so a saved change takes effect without a rebuild.
#
# Deliberately not named docker-compose.override.yml: compose loads that file
# automatically, and someone who only wants the demo would end up in dev mode
# without knowing why. Opting in explicitly is better.

services:
  yolo-service:
    volumes:
      # WORKDIR in the Dockerfile is /app, so the app package lives at /app/app
      - ./app:/app/app
    environment:
      # File change events from Windows do not reach a Linux container, so
      # --reload never fires. Polling costs a little CPU but is the only
      # reliable option.
      WATCHFILES_FORCE_POLLING: "true"
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
