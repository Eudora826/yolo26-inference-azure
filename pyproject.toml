[tool.pytest.ini_options]
# Lets `pytest` import the app package from the repo root without installing it
pythonpath = ["."]

[tool.ruff]
line-length = 90
target-version = "py311"

[tool.ruff.lint]
# E/F basic errors, I import sorting, UP outdated syntax, B common bug patterns (bugbear)
select = ["E", "F", "I", "UP", "B"]

ignore = [
    # app/schemas.py deliberately uses typing.List/Dict/Optional instead of
    # builtin generics (see the note at the top of that file: this keeps the
    # service running on Python 3.8, where Pydantic cannot evaluate builtin
    # generics). The whole codebase follows the same choice, so these rules
    # are off: lint config should encode the project's actual style, not
    # force rewrites of unrelated code.
    "UP006",  # typing.Dict -> dict
    "UP007",  # Optional[X] -> X | None
    "UP035",  # deprecated typing imports
    "UP032",  # .format() -> f-string, same choice

    # Query(...) / Depends(...) as function defaults is the standard FastAPI
    # pattern; B008 is a well-known false positive in FastAPI projects.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
# A few tests import cv2/numpy inside the function on purpose
"tests/*" = ["E402"]
