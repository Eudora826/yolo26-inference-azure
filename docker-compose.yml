# The full observability stack.
#
#   docker compose up --build                  service + monitoring (quiet, low CPU)
#   docker compose --profile demo up --build   plus the load generator (dashboards fill at once)
#
# Ports:
#   8000   YOLO service (web demo / OpenAPI / /metrics)
#   9090   Prometheus (targets, PromQL, alerts)
#   3000   Grafana (dashboards, anonymous read access)
#   16686  Jaeger (tracing)
#
# Design choice: Prometheus scrapes metrics directly, traces go through the
# OTel Collector. Metrics are the service's own account of its health and
# must exist even under a bare docker run; traces only make sense once a
# backend aggregates them, and the Collector decouples that backend.

name: yolo-inference-platform

services:
  # ---------------------------------------------------------------------
  # The service being observed
  # ---------------------------------------------------------------------
  yolo-service:
    build:
      context: .
      args:
        # Passed in from the shell, e.g. in PowerShell first run
        # $env:GIT_SHA = git rev-parse --short HEAD
        # Without it the value is "unknown", and responses say so.
        GIT_SHA: ${GIT_SHA:-unknown}
    image: yolo-inference:local
    ports:
      - "8000:8000"
    environment:
      # Tracing is enabled only when this is set. Without it tracing.py does
      # nothing, so the image can also run on its own with docker run.
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_SERVICE_NAME: yolo-inference-platform
      JOB_RETENTION_MINUTES: "60"
    healthcheck:
      # The slim image has no curl; the bundled Python is more reliable anyway.
      # localhost here is the container itself, which is what we want.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      # Grace period: failures during it do not count towards retries.
      # Importing torch takes several seconds.
      start_period: 40s
    depends_on:
      - otel-collector

  # ---------------------------------------------------------------------
  # Metrics: Prometheus scrapes /metrics on yolo-service
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      # Mount the whole directory (prometheus.yml + alerts.yml), read-only
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # Allows curl -X POST /-/reload to reload config without a restart
      - --web.enable-lifecycle
    depends_on:
      - yolo-service

  # ---------------------------------------------------------------------
  # Dashboards: data source and panels are declared in config files and
  # exist as soon as Grafana starts
  # ---------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.5.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      # Local demo only: anyone who clones the repo can view the dashboards
      # without logging in, which also makes screenshots easy. Acceptable
      # because this stack is never exposed to the internet.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
      # Opening the link lands on our dashboard instead of the Grafana home page
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/yolo-service.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------
  # Traces: app --OTLP--> Collector --> Jaeger
  #
  # Why a Collector in between: switching backends (Jaeger -> Tempo) only
  # changes the config here, with no app change or redeploy; it can also
  # batch, redact and tail-sample.
  # ---------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./deploy/otel-collector/config.yaml:/etc/otel-collector-config.yaml:ro
    # Port 4317 is deliberately not published to the host. yolo-service
    # reaches otel-collector:4317 by service name on the compose network;
    # container-to-container traffic does **not** need a ports mapping, which
    # only exists so the host (your browser, curl) can reach a container.
    #
    # Windows also often reserves 4317 (part of the Hyper-V/WinNAT dynamic
    # port exclusion range), and publishing it fails with
    # "bind: An attempt was made to access a socket in a way forbidden...".
    # To debug from the host, use a high port instead: - "14317:4317"
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    ports:
      - "16686:16686"   # Web UI
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # ---------------------------------------------------------------------
  # Load generator: off by default (profile), because YOLO inference is
  # CPU-heavy
  # ---------------------------------------------------------------------
  loadgen:
    build:
      # The context is the repo root so the Dockerfile can COPY cat.jpg
      context: .
      dockerfile: loadgen/Dockerfile
    profiles: ["demo"]
    environment:
      TARGET_URL: http://yolo-service:8000
      RPS: "3"
      ERROR_RATE: "0.06"
      VIDEO_EVERY_SECONDS: "240"
    depends_on:
      yolo-service:
        # The long syntax with service_healthy waits until the service is
        # actually usable. The short form depends_on: [yolo-service] only
        # waits for the container to start, not for the healthcheck.
        condition: service_healthy

volumes:
  prometheus-data:
  grafana-data:
