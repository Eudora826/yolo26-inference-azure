global:
  # 10 seconds: fine enough to see short spikes without doubling storage and
  # CPU for nothing. rate() windows must be at least 4x this, so queries start
  # at [1m].
  scrape_interval: 10s
  scrape_timeout: 5s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Scrape the /metrics endpoint the service exposes itself.
  # The target is the service name, not localhost: inside a container,
  # localhost is the container itself.
  - job_name: yolo-service
    static_configs:
      - targets: ["yolo-service:8000"]
        labels:
          service: yolo-inference

  # Scrape Prometheus itself too. localhost is right here, because this runs
  # inside the Prometheus container. The prometheus_* metrics show whether the
  # monitoring system itself is healthy; prometheus_tsdb_head_series, for
  # example, is the number of active time series, i.e. cardinality as a number.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
