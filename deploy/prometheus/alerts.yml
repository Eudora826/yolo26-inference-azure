# Alert rules.
#
# Principle: alert on symptoms, not causes. CPU at 100% with no user impact is
# noise; CPU at 30% while every request times out is something a CPU alert
# never catches. Every rule should answer "when this fires, are users actually
# affected?".
#
# Every rule has a `for`: metrics jitter naturally, and without a duration the
# alerts wake people up at night for nothing, alerts get muted, and the
# alerting system is dead (alert fatigue).
#
# Thresholds come from the measured baseline in docs/metrics-design.md:
# inference p95 ~ 86ms.

groups:
  # -----------------------------------------------------------------
  # Recording rules: precompute complex, frequently used queries as new metrics.
  # Naming convention: level:metric:operation.
  # -----------------------------------------------------------------
  - name: yolo-recording
    interval: 15s
    rules:
      # `or vector(0)` is required, not decoration: with no 5xx at all the
      # numerator matches no series and returns an **empty vector**, not 0,
      # and dividing an empty vector is still empty. Without it, this rule
      # (and the panels using it) shows "No data" instead of "0%" while the
      # service is perfectly healthy, which is exactly when it should reassure.
      - record: job:http_error_rate:ratio5m
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[5m])) or vector(0))
            /
          sum(rate(http_requests_total[5m]))

      - record: job:inference_duration_seconds:p95
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(inference_duration_seconds_bucket{source="image"}[5m])) by (le)
          )

      - record: job:detections_per_image:mean5m
        expr: |
          rate(detections_per_image_sum[5m])
            /
          rate(detections_per_image_count[5m])

  - name: yolo-alerts
    rules:
      # ---------------------------------------------------------------
      # Service unavailable. Prometheus generates `up` itself: 1 if the
      # scrape succeeded, 0 if not. Only 2 minutes of `for`: a dead service
      # is the most urgent symptom and needs no long confirmation.
      # ---------------------------------------------------------------
      - alert: ServiceDown
        expr: up{job="yolo-service"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "YOLO service cannot be scraped ({{ $labels.instance }})"
          description: "Prometheus has failed to scrape {{ $labels.instance }}/metrics for 2 minutes; the service may have crashed or be unreachable."

      # ---------------------------------------------------------------
      # 5xx only. A 4xx means the client sent bad data and the service
      # correctly rejected it: that is a feature, not a failure, and should
      # not wake anyone at night.
      # ---------------------------------------------------------------
      - alert: HighErrorRate
        expr: job:http_error_rate:ratio5m > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "5xx error rate {{ $value | humanizePercentage }} (threshold 5%)"
          description: "The server-side error rate has been above 5% for 5 minutes; users are seeing failed requests."

      # ---------------------------------------------------------------
      # Baseline p95 ~ 86ms; the 500ms threshold leaves ~6x headroom.
      # That much room absorbs container overhead and contention, so only a
      # real degradation fires. Picking a round number as the threshold is a
      # classic beginner mistake.
      # ---------------------------------------------------------------
      - alert: InferenceLatencyHigh
        expr: job:inference_duration_seconds:p95 > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Inference p95 reached {{ $value | humanizeDuration }} (baseline ~86ms, threshold 500ms)"
          description: "Model inference is clearly slower. Check the slowest traces in Jaeger to see whether inference itself or decoding slowed down."

      # ---------------------------------------------------------------
      # A backlog is only visible through a gauge: the HTTP request that
      # submits a job always takes tens of milliseconds, so request latency
      # looks calm even with 50 jobs piled up in the background.
      # ---------------------------------------------------------------
      - alert: VideoJobBacklog
        expr: video_jobs_active > 5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} video jobs backed up for 15 minutes"
          description: "Background jobs are consumed more slowly than they are submitted. Single-process BackgroundTasks cannot scale out; consider a task queue."

      # ---------------------------------------------------------------
      # Job failures are invisible in HTTP metrics: POST /videos returns 202
      # and the failure happens after the response, so no request ever
      # returns a 5xx. The second `and` clause keeps a single failure from
      # firing the alert when there are very few samples.
      # ---------------------------------------------------------------
      - alert: VideoJobFailureRate
        expr: |
          (
            sum(rate(video_jobs_total{status="failed"}[15m]))
              /
            sum(rate(video_jobs_total[15m]))
          ) > 0.2
          and
          sum(rate(video_jobs_total[15m])) > 0.002
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Video job failure rate {{ $value | humanizePercentage }} (threshold 20%)"
          description: "Many background annotation jobs are failing. This failure produces no 5xx; only this metric can catch it."

      # ---------------------------------------------------------------
      # Data drift sentinel. Normally 3-5 objects per image; below 0.5 means
      # something is wrong with the input or the model: a broken camera, a
      # swapped model file, a misconfigured threshold. Latency stays normal
      # and the error rate stays at zero, so only a business metric catches
      # it. The `and` clause requires enough traffic, to avoid false alarms
      # when there is none.
      # ---------------------------------------------------------------
      - alert: DetectionRateCollapse
        expr: |
          job:detections_per_image:mean5m < 0.5
          and
          rate(detections_per_image_count[5m]) > 0.05
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Only {{ $value | printf \"%.2f\" }} objects detected per image on average"
          description: "Detections dropped sharply while the service reports no errors. Check the input source and the currently loaded model (see the model_info metric)."

      # ---------------------------------------------------------------
      # Heavy rate limiting: someone may be load testing, or the limit may be
      # set too low. Severity is only info: someone should take a look, but
      # nothing needs immediate action.
      # ---------------------------------------------------------------
      - alert: RateLimitingActive
        expr: sum(rate(rate_limited_requests_total[5m])) > 0.5
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Rate limiting is blocking {{ $value | printf \"%.2f\" }} requests per second"
          description: "A client keeps hitting the rate limit. Check whether the traffic is abnormal or RATE_LIMIT_PER_MINUTE is too tight."
