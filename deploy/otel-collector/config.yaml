# OpenTelemetry Collector: handles traces only.
#
# There is deliberately **no metrics pipeline** here: Prometheus scrapes the
# service's /metrics directly, bypassing the Collector. That way metrics still
# work when the service runs alone with docker run; metrics are the service's
# own account of its health and should not depend on an external component.
#
# Traces are the opposite: a trace only makes sense once a backend collects
# it, so traces go through the Collector. Switching backends (Jaeger -> Tempo
# -> some SaaS) then only changes this file, with no app change or redeploy.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # memory_limiter must come first in the processors list, otherwise it cannot
  # protect the processors after it. Under a traffic spike it drops data
  # instead of letting the Collector run out of memory.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  # Send in batches to cut network round trips.
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  # Jaeger supports OTLP natively since 1.35, so the otlp exporter can point
  # straight at it. The `jaeger` exporter from older tutorials is deprecated.
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true   # inside the same compose network, no TLS to negotiate

  # For debugging whether the Collector receives anything: docker compose logs otel-collector
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug]
  telemetry:
    logs:
      level: info
