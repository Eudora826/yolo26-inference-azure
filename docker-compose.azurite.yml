# Blob storage overlay: video jobs keep their files in Azurite, Microsoft's
# local Azure Storage emulator, instead of the container's disk. No Azure
# account and no cost.
#
#   docker compose -f docker-compose.yml -f docker-compose.azurite.yml up --build
#
# Same pattern as docker-compose.dev.yml: opt in explicitly, so the default
# stack keeps using local disk.

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    # Blob service only (no queue/table). --skipApiVersionCheck: the Python
    # SDK can be newer than the emulator and send an API version Azurite does
    # not know yet; for local testing that check only gets in the way.
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--blobPort", "10000",
              "--skipApiVersionCheck", "--loose"]
    ports:
      # Published so a browser on the host can follow the SAS download link.
      - "10000:10000"

  yolo-service:
    environment:
      STORAGE_BACKEND: blob
      # The well-known Azurite development account and key, published in
      # Microsoft's documentation. Not a secret, and only valid for the
      # emulator. A real connection string never goes in a committed file:
      # it belongs in .env (git-ignored) or the platform's secret store.
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      # The service reaches Azurite as "azurite", a name only containers can
      # resolve; download links handed to clients must use the host address.
      AZURE_STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:10000/devstoreaccount1
    depends_on:
      - azurite
