name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Weights stay out of git (6.3 MB binary) and are downloaded when needed
  WEIGHTS_URL: https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8n.pt

# Runners are pinned to ubuntu-24.04 rather than ubuntu-latest: that label
# moves on GitHub's schedule (to Ubuntu 26 from 2026-10-19), so CI could turn
# red one morning without a single code change. Reproducibility beats
# "always latest".

jobs:
  # Fastest job first: failing early saves CI time and yours
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.6.9
      - run: ruff check .

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Without the cache, every run downloads 200 MB of torch again
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Download model weights
        run: wget -q "$WEIGHTS_URL"
      # The Blob storage tests run against Azurite, the local emulator. Started
      # with docker run rather than as a service container, because the
      # emulator needs command-line flags and services cannot set a command.
      - name: Start Azurite
        run: |
          docker run -d --name azurite -p 10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.37.0 \
            azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --skipApiVersionCheck --loose
      - name: Run tests
        # Locally the Blob tests skip when Azurite is not running; here a
        # missing emulator must fail the build instead. A test that always
        # skips is a test that does not exist.
        env:
          REQUIRE_AZURITE: "1"
        run: pytest -q

  build:
    runs-on: ubuntu-24.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      # Deliberately no weights download here: the Dockerfile fetches them
      # itself. This job then follows the same path as a fresh clone; fetching
      # the file first would quietly cover up the problem users would hit.
      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t yolo-inference:ci .
      - name: Report image size
        run: docker images yolo-inference:ci --format "{{.Repository}}:{{.Tag}}  {{.Size}}"

  # Unit tests check the code logic; the smoke test checks that the **whole
  # stack actually runs**. It catches a class of problems unit tests cannot
  # see: a wrong service name, port, mount path, healthcheck, or Grafana
  # provisioning path.
  smoke:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      # Same idea: start the stack from a clean checkout with the exact
      # command the README gives.
      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the service
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "service is up after ${i} attempts"; exit 0
            fi
            sleep 5
          done
          echo "service never became healthy"; exit 1

      - name: Generate some traffic
        run: |
          for i in $(seq 1 5); do
            curl -sf -X POST "http://localhost:8000/predict" -F "file=@cat.jpg" > /dev/null
          done
          # One deliberately bad request, so the error path is recorded too
          curl -s -o /dev/null -X POST "http://localhost:8000/predict" \
            -F "file=@README.md;type=text/plain"

      - name: Service exposes the metrics we expect
        run: |
          curl -sf http://localhost:8000/metrics > metrics.txt
          for m in http_requests_total inference_duration_seconds_bucket \
                   detections_total video_jobs_active http_requests_in_flight; do
            grep -q "^${m}" metrics.txt || { echo "missing metric: $m"; exit 1; }
          done
          echo "all expected metrics present"

      - name: Prometheus is actually scraping the service
        run: |
          # Curling /health is not enough: this checks that Prometheus
          # actually scraped data. That is why this job exists.
          #
          # Two safeguards, both learned from real CI failures:
          #
          #  1. The whole pipeline sits inside `if`. GitHub Actions runs
          #     scripts with bash -e, and a failing command inside `if`
          #     does **not** trigger -e. An earlier version piped curl's
          #     output into python; before Prometheus finished its first
          #     scrape, curl returned nothing, python raised
          #     JSONDecodeError, and -e killed the step within 0.2 seconds,
          #     before the retry loop completed a single pass.
          #
          #  2. -G --data-urlencode lets curl encode {} and the quotes,
          #     instead of putting raw characters in the URL.
          for i in $(seq 1 30); do
            if curl -s -G 'http://localhost:9090/api/v1/query' \
                 --data-urlencode 'query=up{job="yolo-service"}' \
                 | grep -q '"value":\[[^]]*,"1"\]'; then
              echo "target is UP after ${i} attempt(s)"
              exit 0
            fi
            echo "attempt ${i}: prometheus has not scraped the target yet"
            sleep 5
          done
          echo "::error::prometheus never reported the target as up"
          echo "--- query response ---"
          curl -s -G 'http://localhost:9090/api/v1/query' --data-urlencode 'query=up' || true
          echo ""
          echo "--- targets ---"
          curl -s http://localhost:9090/api/v1/targets || true
          exit 1

      - name: Grafana is up and the dashboard was provisioned
        run: |
          curl -sf http://localhost:3000/api/health > /dev/null
          curl -sf http://localhost:3000/api/dashboards/uid/yolo-service > /dev/null \
            || { echo "dashboard was not provisioned"; exit 1; }
          echo "grafana ok"

      - name: Jaeger received traces
        run: |
          for i in $(seq 1 12); do
            if curl -sf "http://localhost:16686/api/services" | grep -q "yolo-inference-platform"; then
              echo "traces arrived"; exit 0
            fi
            sleep 5
          done
          echo "jaeger never saw the service"; exit 1

      # Without this step, a failed run gives no clue why
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
